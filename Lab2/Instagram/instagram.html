<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssinsta.css">
    <title>Instagram</title>
    <link rel="icon" href="image2.png" type="image/x-icon">
</head>
<body>
<div class="parent">
 <div class="left">
    <div class="left-top">

      <img src="insta.png" class="logo" alt="Instagram">

      <p class="maintext">Посмотрите, какими моментами из жизни поделились ваши <span class="closfriend">близкие друзья.</span></p>
    </div>
    <div class="left-images">
        <img src="insta_images/something.webp" class="mainphoto">


    </div>
 
</div>
<div class="divider" aria-hidden="true"></div>
<div class="right">
    <div class="card">
        <div class="field">
        <form action="#" method="post" class="form">
        <p class="head">Войти в Instagram</p>

        <input type="email" class="input"
          placeholder="Имя пользователя, номер мобильного телефона или электронной почты">

        <input type="password" placeholder="Пароль" class="input">

        <button type="submit" class="btn primary">Войти</button>

        <a href="#" class="forgot">Забыли пароль?</a>
        <br>
        <button type="button" class="btn fb">
          <img src="facebook.png" alt="" class="fb-icon" height="12px" width="auto">
          Войти через Facebook
        </button>

        <button type="button" class="btn outline">
          Создать новый аккаунт
        </button>

        <div class="meta">
          <img src="insta_images/meta.avif" alt="Meta" width="15" height="15">
          <span>Meta</span>
        </div>
      </form>
        </div>

    </div>
</div>

</div>
<div class="divider-horizontal">
    

</div>
<footer>
    <footer class="footer">
  <ul class="footer-links">
    <li><a href="#">Meta</a></li>
    <li><a href="#">Информация</a></li>
    <li><a href="#">Блог</a></li>
    <li><a href="#">Вакансии</a></li>
    <li><a href="#">Помощь</a></li>
    <li><a href="#">API</a></li>
    <li><a href="#">Конфиденциальность</a></li>
    <li><a href="#">Условия</a></li>
    <li><a href="#">Места</a></li>
    <li><a href="#">Instagram Lite</a></li>
    <li><a href="#">Threads</a></li>
    <li><a href="#">Meta Verified</a></li>
  </ul>

  <div class="footer-bottom">
    <button class="lang" type="button">Русский ▾</button>
    <span>© 2026 Instagram from Meta</span>
  </div>
</footer>

    
</body>
</html>
